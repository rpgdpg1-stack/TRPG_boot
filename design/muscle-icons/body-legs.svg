<!--
  Силуэт «Ноги» — база иконок для групп «Ноги» и «Ягодицы».

  Как править в Figma:
   • сетка 24×24 (файл открывается 240×240 — та же сетка ×10, координаты
     в коде делятся на 10);
   • ширина таза совпадает с шириной корпуса торса (10 единиц) — если меняешь
     корпус в body-torso.svg, таз стоит подвинуть на столько же, иначе две
     иконки будут разной «комплекции»;
   • правки формы вернуть в src/components/MuscleGroupIcon.jsx (LegsBase).

  Цвет тут серый только для наглядности — в приложении это
  rgba(255,255,255,0.22), а подсветка мышцы красится цветом группы.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 24 24" fill="none">
  <g id="Ноги" fill="#8A8A8A">
    <rect id="Нога левая" x="7.4" y="5.6" width="3.7" height="16" rx="1.7"/>
    <rect id="Нога правая" x="12.9" y="5.6" width="3.7" height="16" rx="1.7"/>
    <rect id="Таз" x="7" y="1.8" width="10" height="4.2" rx="1.8"/>
  </g>
</svg>
