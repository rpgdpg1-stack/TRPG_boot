<!--
  Силуэт «Ноги» — база иконок для групп «Ноги» и «Ягодицы».
  Геометрия Дмитрия, координаты 1:1 с кодом.

  ВАЖНО ПРО ЗАЛИВКУ: прозрачность висит на ГРУППЕ, а не на каждой фигуре —
