<!--
  Силуэт «Торс» — база иконок групп мышц (спина, грудь, пресс, плечи, бицепс,
  трицепс, предплечья, шея, руки). Геометрия Дмитрия, координаты 1:1 с кодом.

  Фигуры — прямоугольники со скруглением (а не заплющенные пути): в Figma такие
  правятся ручками и радиусом, а не по точкам.

  ВАЖНО ПРО ЗАЛИВКУ: прозрачность висит на ГРУППЕ, а не на каждой фигуре.
  Если раздать альфу по фигурам, перекрытия сложатся и на плечевом поясе
  появятся светлые пятна — силуэт станет лоскутным. В приложении так же.

  Правки формы вернуть в src/components/MuscleGroupIcon.jsx (TorsoBase),
  окно вида там — viewBox "290 0.5 220 220".
-->
<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="290 0.5 220 220" fill="none">
  <g id="Торс" fill="#8A8A8A">
    <circle id="Голова" cx="400" cy="38" r="33"/>
    <rect id="Шея" x="386" y="63.97" width="28" height="28"/>
    <rect id="Рука левая" x="317" y="86" width="30" height="112" rx="15"/>
    <rect id="Рука правая" x="453" y="86" width="30" height="112" rx="15"/>
    <rect id="Корпус" x="354" y="86" width="92" height="130" rx="21"/>
    <rect id="Плечевой пояс" x="317" y="82" width="166" height="35" rx="17.5"/>
  </g>
</svg>
