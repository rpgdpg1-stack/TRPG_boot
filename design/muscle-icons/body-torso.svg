<!--
  Силуэт «Торс» — база иконок групп мышц (спина, грудь, пресс, плечи, бицепс,
  трицепс, предплечья, шея, руки).

  Как править в Figma:
   • сетка 24×24 (файл открывается 240×240 — это та же сетка ×10, чтобы удобно
     тянуть мышкой; координаты в коде делятся на 10);
   • слои названы по-русски, порядок снизу вверх как в коде;
   • «Плечевой пояс» лежит ПОВЕРХ рук и корпуса — он их и сшивает, поэтому
     двигать его надо вместе с руками;
   • правки формы вернуть в src/components/MuscleGroupIcon.jsx (TorsoBase).

  Цвет тут серый только для наглядности — в приложении это
  rgba(255,255,255,0.22), а подсветка мышцы красится цветом группы.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 24 24" fill="none">
  <g id="Торс" fill="#8A8A8A">
    <circle id="Голова" cx="12" cy="4.2" r="2.9"/>
    <rect id="Шея" x="10.8" y="6.4" width="2.4" height="2.6"/>
    <rect id="Рука левая" x="3.4" y="8.6" width="3" height="10.9" rx="1.5"/>
    <rect id="Рука правая" x="17.6" y="8.6" width="3" height="10.9" rx="1.5"/>
    <rect id="Корпус" x="7.2" y="8.6" width="9.6" height="13" rx="2.2"/>
    <rect id="Плечевой пояс" x="3.4" y="8.6" width="17.2" height="4.2" rx="2.1"/>
  </g>
</svg>
