name: Описание бота

# Только вручную. Расписания нет намеренно: текст статичный, счётчика в нём
# больше нет — обновлять по таймеру нечего. Запускается, когда текст правили.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Только показать, ничего не менять
        type: boolean
        default: true

jobs:
  about:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Обновить описание
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ABOUT_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/bot-about.mjs
