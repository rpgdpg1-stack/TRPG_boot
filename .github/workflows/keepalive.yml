name: Supabase keepalive

on:
  schedule:
    # Понедельник и четверг 09:00 UTC = 12:00 МСК
    - cron: '0 9 * * 1,4'
  workflow_dispatch: # ручной запуск кнопкой

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Нужен только ради scripts/notify-failure.mjs — сама задача файлов не читает.
      - uses: actions/checkout@v5

      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS -X PATCH "$URL/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"last_ping\": \"$(date -u +%FT%TZ)\"}"

      # Упало — сообщение в Telegram (см. scripts/notify-failure.mjs).
      # Успешные прогоны молчат: тишина в чате и значит «всё хорошо».
      - name: Сообщить о падении
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: node scripts/notify-failure.mjs "Supabase keepalive"
