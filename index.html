<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Цвет статус-бара и системных областей iOS/Android.
         Должен совпадать с --color-bg чтобы не было видимых "швов" между
         приложением и системным UI Telegram. -->
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Явно говорим системе что тема тёмная. Без этого iOS первый кадр
         рисует клавиатуру в светлом translucent-виде (с блюром), а потом
         перерисовывает в тёмную — отсюда моргание фона клавиатуры. -->
    <meta name="color-scheme" content="dark" />

    <!-- Иконка вкладки. Тот же логотип, что на аватарке бота, — если человек
         открыл приложение ссылкой в обычном браузере, вкладка выглядит своей,
         а не безымянным листком. Внутри Telegram эта иконка не используется:
         там вкладок нет, а значок в списке чатов берётся из аватара бота. -->
    <link rel="icon" type="image/webp" href="/favicon.webp" />

    <title>TRPG</title>

    <!-- Telegram Web App SDK.
         defer обязателен: без него браузер останавливает разбор страницы и
         ждёт ответа telegram.org, а вместе с ним ждёт и человек — из России
         этот адрес отвечает медленно, и всё, что он видит, это застывшая
         полоса загрузки. С defer загрузочный экран рисуется сразу, а SDK
         подъезжает параллельно.
         Порядок при этом сохраняется: отложенные скрипты выполняются в
         порядке их появления в документе, а бандл приложения объявлен ниже
         (type="module" тоже отложенный) — значит SDK всегда готов раньше.
         Если он не доедет вовсе, приложение это переживёт: обращения к нему
         везде через необязательную цепочку, а загрузочный сторож ниже
         покажет понятный экран. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Шрифты лежат у нас (public/fonts, объявлены в styles/fonts.css).
         Ссылки на fonts.googleapis.com здесь больше НЕТ и быть не должно:
         внешняя таблица стилей блокирует отрисовку, и пока Google молчит,
         человек смотрит на застывшую полосу загрузки. Preload на два файла
         первого экрана — кириллица для текста, латиница Geist для цифр —
         чтобы они поехали сразу, не дожидаясь разбора CSS. -->
    <link rel="preload" href="/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- СРЕДА: Telegram или обычный браузер. Ставим класс ДО первого кадра,
         иначе шапка успеет отрисоваться с телеграмными отступами и прыгнет.
         Признак двойной: подписанные данные Telegram ИЛИ его параметры в адресе.
         Одного initData мало — внутри Telegram он бывает пустым на плохой связи,
         и мы бы приняли своего за чужого. -->
    <script>
      (function () {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          var byUrl = String(window.location.href || '').indexOf('tgWebApp') !== -1;
          if (!(tg && tg.initData) && !byUrl) {
            document.documentElement.classList.add('in-browser');
          }
        } catch (e) { /* ничего не делаем: без класса приложение просто работает как в Telegram */ }
      })();
    </script>

    <!-- Цвет фона страницы ставим из CSS-переменной сразу, до загрузки JS,
         чтобы при медленном интернете не было белой вспышки. -->
    <style>
      html, body { background: #0A0A0B; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Экран-спасатель. Показывается загрузочным «сторожем» ниже, если приложение
         не поднялось за BOOT_TIMEOUT_MS (белый экран / повисший лоадер / битый старый
         чанк из кеша Telegram). Стили инлайн и без внешних шрифтов — работает, даже
         если основной бандл/CSS не загрузились. -->
    <style>
      /* Пресс-эффект и снятие системной подсветки — как у кнопок в приложении. */
      #boot-fallback button {
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.12s ease, opacity 0.12s ease;
        cursor: pointer;
      }
      #boot-fallback button:active { transform: scale(0.96); opacity: 0.9; }
    </style>
    <div id="boot-fallback" style="display:none; position:fixed; inset:0; z-index:100000; background:#0A0A0B; color:#F0F0F0; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <!-- Иконка обновления — монохромный SVG (Material «refresh»), а не системный
           эмодзи: он выбивался из стиля приложения. -->
      <div style="margin-bottom:8px; line-height:0;">
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z" fill="#9A9A9A"/>
        </svg>
      </div>
      <div id="boot-title" style="font-size:17px; font-weight:700; letter-spacing:0.4px; margin-bottom:10px;">Не удалось загрузить данные</div>
      <!-- Один случай мы РАЗЛИЧАЕМ точно: приложение открыли вне Telegram.
           Тогда вход невозможен в принципе (нет подписанных данных Telegram),
           и предлагать «перезапустить» — врать: сколько ни перезапускай,
           в браузере оно не заработает. Остальные причины (сеть, сервер,
           таймаут, кеш) снаружи не отличить, поэтому там текст общий. -->
      <div id="boot-text" style="font-size:14px; color:#9A9A9A; line-height:1.5; max-width:290px; margin-bottom:12px;">
        Попробуйте перезапустить приложение. Если проблема повторится — попробуйте позже.
      </div>
      <button id="boot-restart" style="padding:14px 28px; background:#9ED153; color:#0D0C0C; font-size:15px; font-weight:700; letter-spacing:0.2px; border:none; border-radius:26px;">
        Перезапустить
      </button>
      <!-- Вторичное действие: заметно светлее подписи, чтобы читалось как действие. -->
      <button id="boot-close" style="margin-top:16px; padding:10px 20px; background:transparent; color:rgba(255,255,255,0.75); font-size:13px; font-weight:600; border:none;">
        Закрыть приложение
      </button>
    </div>

    <script>
      (function () {
        // Сколько ждём поднятия приложения, прежде чем показать спасатель.
        var BOOT_TIMEOUT_MS = 15000;

        // Жёсткая перезагрузка со сбросом кешей + cache-busting URL — чтобы Telegram
        // взял свежий index.html/бандл, а не старый из кеша WebView.
        function hardReload() {
          try {
            if (window.caches && caches.keys) {
              caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
            }
          } catch (e) { /* ignore */ }
          location.replace(location.pathname + '?r=' + Date.now());
        }

        function el(id) { return document.getElementById(id); }

        // Тактильный отклик Telegram — как у остальных кнопок приложения.
        function buzz(style) {
          try {
            var hf = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback;
            if (hf && hf.impactOccurred) hf.impactOccurred(style || 'medium');
          } catch (e) { /* ignore */ }
        }

        function wire() {
          var r = el('boot-restart');
          if (r) r.addEventListener('click', function () { buzz('medium'); hardReload(); });
          var c = el('boot-close');
          if (c) c.addEventListener('click', function () {
            buzz('light');
            try { window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.close(); } catch (e) { /* ignore */ }
          });
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', wire);
        } else {
          wire();
        }

        // Приложение выставляет window.__APP_BOOTED__ = true, когда прошло загрузчик
        // (App.jsx). Если за таймаут флаг не встал — показываем спасатель.
        setTimeout(function () {
          if (window.__APP_BOOTED__) return;
          var f = el('boot-fallback');
          if (!f) return;

          // Вне Telegram initData пустой — приложению нечем подтвердить, кто ты.
          // Говорим об этом прямо и убираем «Перезапустить»: кнопка, которая
          // заведомо не поможет, злит сильнее, чем её отсутствие.
          //
          // ОДНОГО initData МАЛО. Внутри Telegram он тоже бывает пустым — если
          // telegram-web-app.js не успел загрузиться на плохой связи. Тогда
          // человек СИДИТ в Telegram, а мы бы отправили его «открыть через
          // Telegram» и спрятали единственную рабочую кнопку. Поэтому вторым
          // признаком смотрим адрес: открывая Mini App, Telegram дописывает
          // в него tgWebApp-параметры, и они на месте даже когда скрипт не дошёл.
          var tg = window.Telegram && window.Telegram.WebApp;
          var url = String(window.location.href || '');
          var launchedByTelegram = url.indexOf('tgWebApp') !== -1;
          if ((!tg || !tg.initData) && !launchedByTelegram) {
            var t = el('boot-title');
            var x = el('boot-text');
            var r = el('boot-restart');
            var c = el('boot-close');
            if (t) t.textContent = 'Откройте через Telegram';
            if (x) x.textContent = 'Приложение работает внутри Telegram — там оно узнаёт вас без пароля. По прямой ссылке в браузере войти не получится.';
            if (r) r.style.display = 'none';
            if (c) c.style.display = 'none';
          }

          f.style.display = 'flex';
        }, BOOT_TIMEOUT_MS);

        // Если приложение поднялось уже ПОСЛЕ показа спасателя (медленная сеть) —
        // прячем его обратно.
        var iv = setInterval(function () {
          if (window.__APP_BOOTED__) {
            var f = el('boot-fallback');
            if (f) f.style.display = 'none';
            clearInterval(iv);
          }
        }, 1000);
      })();
    </script>
  </body>
</html>
