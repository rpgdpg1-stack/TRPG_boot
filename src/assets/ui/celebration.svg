<!--
  Фанфары — единственная цветная иконка в наборе.

  Остальные рисуются currentColor и подхватывают цвет места. Здесь цвет и есть
  смысл: возвращение после долгой паузы — редкое событие, и отмечают его
  конфетти, а не очередная зелёная галочка.

  Рисунок нарочно крупный и простой: иконка живёт в строке текста при
  22–26 px, и мелкие детали там сливаются в пятно.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Рожок: одна крупная форма вместо двух мелких -->
  <path d="M4 44 17 19l10 10L4 44Z" fill="#9ED153"/>
  <path d="M4 44l5-9.5 4.5 4.5L4 44Z" fill="#6FA234"/>
  <!-- Конфетти: три пятна, крупные и разнесённые -->
  <circle cx="37" cy="11" r="4" fill="#F2F2F0"/>
  <circle cx="29" cy="27" r="3.2" fill="#FFB454"/>
  <rect x="38" y="26" width="7" height="7" rx="2" transform="rotate(20 38 26)" fill="#9ED153"/>
  <!-- Лучи: толще и длиннее -->
  <path d="M22 14 26 5M30 18 40 20" stroke="#F2F2F0" stroke-width="3.2" stroke-linecap="round"/>
</svg>
